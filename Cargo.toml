[package]
name = "llamatop"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Terminal dashboard for a llama.cpp server and the machine that runs it"
license = "MIT"
repository = "https://github.com/Fleorens/llamatop"
readme = "README.md"
keywords = ["llama-cpp", "tui", "dashboard", "llm", "monitoring"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossterm = "0.29.0"
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1"
ureq = { version = "3.5.1", default-features = false }

[profile.release]
# One small, fast binary to copy to the aibox: no debug symbols, cross-crate inlining.
lto = "thin"
codegen-units = 1
strip = true
